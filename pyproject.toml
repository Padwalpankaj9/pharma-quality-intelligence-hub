[project]
name = "pharma-quality-intelligence-hub"
version = "1.0.0"
description = "FAIR Pharma Quality Data Product on Databricks with Python MCP Server, FastAPI, AI Security Guardrails, and Evaluation Suite"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "mcp>=1.2.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[project.scripts]
pharma-qih-pipeline = "pharma_qih.pipeline.run_pipeline:main"
pharma-qih-mcp = "pharma_qih.mcp_server:main"
pharma-qih-api = "pharma_qih.api:main"
pharma-qih-eval = "pharma_qih.eval_runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pharma_qih"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
